<style>
/* Layout: full-bleed 3D stage (ice bucket on a table, bokeh behind). After the pop:
   twine garland across the top, bubbles rising from the neck, paper notes mid-screen. */
:root{
  color-scheme:dark;
  --room:#0a0816; --paper:#f1e9d8; --ink:#2b2219; --gold:#c9a45a; --gold-hi:#f2d99a; --muted:#bfae93;
  --f-display:'Cormorant Garamond','Forum',Georgia,'Times New Roman',serif;
  --f-label:'Forum',Georgia,serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Script','Comic Sans MS',cursive;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .36 0 0 0 0 .28 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--paper);font:400 15px/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{display:block}
#bg,#gl,#fx{position:fixed;inset:0;width:100%;height:100%}
#bg{z-index:0;inset:auto;left:0;top:-30%;width:100%;height:130%;will-change:transform}
#fw{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#gl{z-index:1;touch-action:none;outline:none}
#fx{z-index:4;pointer-events:none}
#sky{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(50% 40% at 50% 55%,#fff6e0,transparent 70%)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

.snd{position:fixed;z-index:9;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:1px solid #ffffff22;background:#00000040;backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;color:#e9dcc3;opacity:.7}
.snd svg{width:18px;height:18px}
.snd[aria-pressed="false"] .on,.snd[aria-pressed="true"] .off{display:none}

/* photos along the sides of the page */
.side{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:clamp(76px,22vw,150px);display:flex;flex-direction:column;justify-content:space-around;align-items:center;pointer-events:none}
.side.left{left:max(10px,env(safe-area-inset-left,0px))}
.side.right{right:max(10px,env(safe-area-inset-right,0px))}
.print{position:relative;width:100%;border:0;padding:6%;cursor:pointer;pointer-events:auto;transform:rotate(var(--r,0deg));
 background:var(--noise),linear-gradient(160deg,#fbf9f4,#e9e4d8);box-shadow:0 14px 26px #000c,0 2px 4px #0008}
.print::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ffffff2e,transparent 30%,transparent 72%,#00000014);pointer-events:none}
.print .ph{aspect-ratio:4/5}
.print .cap{position:static;display:block;margin-top:5%;font-size:clamp(13px,3.4vw,18px)}
.fly{position:fixed;z-index:8;left:0;top:0;pointer-events:none;will-change:transform}
.ph{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:#222;box-shadow:inset 0 0 0 1px #0003}
.ph>svg,.ph>img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.92) contrast(1.04) sepia(.08)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#ffffff30,transparent 35%,transparent 70%,#ffffff10);pointer-events:none}
.cap{text-align:center;font:600 15px/1 var(--f-hand);color:#2d2a4a}

/* bubbles */
.bubble{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;border-radius:50%;cursor:pointer;will-change:transform;background:radial-gradient(circle,#ffffff14 0 55%,#ffffff40 80%,#ffffffa6 96%,#fff0 100%);
 -webkit-backdrop-filter:blur(.6px) brightness(1.12) saturate(1.25);backdrop-filter:blur(.6px) brightness(1.12) saturate(1.25)}
.bubble::before{content:"";position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(from 210deg,#ffffff55,#ffffff22,#ffffff66,#ffffff22,#ffffff55);
 -webkit-mask:radial-gradient(circle,transparent 62%,#000 78%,#000 97%,transparent 100%);mask:radial-gradient(circle,transparent 62%,#000 78%,#000 97%,transparent 100%)}
.bubble::after{content:"";position:absolute;inset:0;border-radius:50%;
 background:radial-gradient(circle at 31% 26%,#fffffff0 0 3.5%,#ffffff70 6%,transparent 13%),radial-gradient(circle at 70% 77%,#ffffff55 0 3%,transparent 10%),radial-gradient(circle,transparent 70%,#ffffff26 86%,#ffffff8c 97%,transparent 100%);
 box-shadow:0 0 18px #ffffff40,inset 0 0 12px #ffffff40,0 3px 12px #6b4a2a30,0 0 0 1px #8a6a4a26}
.bubble .in{position:absolute;inset:16%;border-radius:50%;overflow:hidden;opacity:.78;-webkit-mask:radial-gradient(circle,#000 55%,transparent 72%);mask:radial-gradient(circle,#000 55%,transparent 72%)}
.bubble .in>*{width:100%;height:100%;display:block;object-fit:cover}
.bubble.pop{pointer-events:none;animation:pop .22s ease-out forwards}
@keyframes pop{to{scale:1.6;opacity:0}}

/* paper note with a wish */
.note{position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 26vh);width:min(340px,calc(100% - 40px));transform:translateX(-50%) rotate(var(--r,-1.5deg));
 background:var(--noise),linear-gradient(175deg,#f7f1e3,#e9dfc9);color:var(--ink);padding:20px 22px 22px;border-radius:2px;
 box-shadow:0 18px 40px #000c,0 2px 0 #fff9 inset;animation:noteIn .45s cubic-bezier(.2,.9,.3,1.15);cursor:pointer}
.note::before{content:"";position:absolute;left:50%;top:-10px;width:70px;height:22px;margin-left:-35px;transform:rotate(-3deg);background:#efe6cfb8;box-shadow:0 1px 2px #0003;backdrop-filter:blur(1px)}
.note p{margin:0;font:italic 500 21px/1.38 var(--f-display);text-wrap:pretty}
.note.out{animation:noteOut .35s ease-in forwards}
@keyframes noteIn{from{opacity:0;translate:0 24px;scale:.94}}
@keyframes noteOut{to{opacity:0;translate:0 -16px}}

/* finale and photo viewer */
.over-lay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#0a0705b3;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fade .5s}
@keyframes fade{from{opacity:0}}
.card{position:relative;width:min(420px,100%);max-height:100%;overflow:auto;text-align:center;color:var(--ink);padding:34px 26px 26px;border-radius:4px;
 background:var(--noise),linear-gradient(170deg,#f8f2e4,#e8dcc2);box-shadow:0 30px 80px #000d,inset 0 0 0 8px #f5eedd,inset 0 0 0 9.5px var(--gold),inset 0 0 0 12px #f5eedd,inset 0 0 0 12.8px #c9a45a99}
.over{margin:0 0 10px;font:400 13px var(--f-label);letter-spacing:.22em;text-transform:uppercase;color:#8a6f45}
.card h2{margin:0 0 14px;font:italic 600 38px/1.04 var(--f-display);text-wrap:balance;background:linear-gradient(100deg,#8a6526,#d9b366 40%,#9b7330 60%,#c79d4f);-webkit-background-clip:text;background-clip:text;color:transparent}
.final{margin:0 0 16px;font:500 19px/1.42 var(--f-display)}
.live{margin:0;font:500 13px var(--f-body);color:#5b4b35}
.live b{font-variant-numeric:tabular-nums;font-weight:600}
.from{margin:10px 0 20px;font:600 26px var(--f-hand);color:#2d2a4a}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);border-radius:99px;padding:10px 20px;cursor:pointer;border:1px solid #2b221955;background:transparent;color:var(--ink)}
.btn.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.viewer{cursor:zoom-out}
.pol{position:relative;padding:14px 14px 50px;width:min(86vw,380px);transform:rotate(-2deg);background:var(--noise),linear-gradient(170deg,#fbf8f1,#ece6d8);box-shadow:0 30px 70px #000d}
.pol .ph{aspect-ratio:3/4}
.pol .cap{position:absolute;left:0;right:0;bottom:12px;font-size:28px}
.nogl{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px));text-align:center;color:var(--muted);font:500 16px var(--f-body)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

</head>

</div>

</div>

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c};
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function elapsed(n){
  let y=n.getFullYear()-WEDDING.y,m=n.getMonth()+1-WEDDING.m,d=n.getDate()-WEDDING.d,h=n.getHours()-WEDDING.h,i=n.getMinutes()-WEDDING.i;
  if(i<0){i+=60;h--}
  if(h<0){h+=24;d--}
  if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  return{y,m,d,h,i,s:n.getSeconds()};
}

function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}

/* Этикетка: цветной слой + карты металла/шероховатости (золотое тиснение) */

function paperBase(){
  if(paperCache)return paperCache;
  const c=cnv(LW,LH),x=c.getContext('2d');
  x.fillStyle='#efe5cd';x.fillRect(0,0,LW,LH);
  const img=x.getImageData(0,0,LW,LH),d=img.data;

function addUnwrap(d){
  const before=S.unwrap;S.unwrap=Math.min(1,S.unwrap+d);
  const tear=Math.min(1,S.unwrap/.5);
  if(tear>S.tear){spawnShards(S.tear,tear);S.tear=tear;if(throttle('foil',55))sfx('foil',.9)}
  if(S.unwrap>.5){S.spin=(S.unwrap-.5)/.5*Math.PI*6;const k=Math.floor(S.spin/Math.PI);if(k>S.lastTick){S.lastTick=k;sfx('tick')}}
  if(S.unwrap>=1&&before<1)cageOff();
}
function addPressure(d){S.pressure=Math.min(1,S.pressure+d);if(S.pressure>=1)doPop()}
function drag(dx,dy){
  const u=unit();
  switch(S.stage){
    case'bucket':{S.lift=clamp(S.lift-dy/(H*.42),0,1);const st=Math.floor(S.lift/.12);if(st!==S.lastStep){S.lastStep=st;sfx(Math.random()<.5?'clink':'ice',.8)}if(S.lift>=1)startLift();break}
    case'unwrap':addUnwrap(Math.hypot(dx,dy)/(u*7));break;
    case'shake':{
      S.shakeX=clamp(S.shakeX+dx/u*140,-70,70);
      const sg=Math.sign(dx);if(sg&&sg!==S.sign&&Math.abs(dx)>2){S.sign=sg;if(throttle('slosh',120))sfx('slosh',.5+S.pressure*.6);addPressure(.004)}
      addPressure(Math.abs(dx)/(u*30));break}
  }
}
function tap(k){
  switch(S.stage){
    case'bucket':S.jig=1;sfx('ice');if(k>1){S.lift=clamp(S.lift+.26,0,1);if(S.lift>=1)startLift()}break;
    case'unwrap':addUnwrap(.02*k);if(S.unwrap<=.5)sfx('foil');break;
    case'shake':S.shakeX=S.shakeX>0?-40:40;sfx('slosh');addPressure(.015*k);break;
  }
}
function spawnShards(a,b){
  const top=3.285*K,bot=2.8*K,n=Math.ceil((b-a)*70);
  for(let i=0;i<n;i++){const y=top-(top-bot)*rnd(a,b),r=(R(y/K)+.01)*K,x=rnd(-r,r),side=Math.sign(x)||1;
    const pts=[];const m=rnd(4,6),sz=rnd(3,8);for(let k=0;k<m;k++){const ang=k/m*6.283+rnd(-.3,.3);pts.push([Math.cos(ang)*sz*rnd(.5,1),Math.sin(ang)*sz*rnd(.5,1)])}
    S.shards.push({x,y:-y,vx:side*rnd(40,220),vy:-rnd(60,300),r:rnd(0,6),vr:rnd(-12,12),pts,life:rnd(1,1.6)})}
}

const LA=1.05,LY0=.66*K,LY1=1.62*K;

  const r=.4635*K,N=48,h=LY1-LY0;
  for(let i=0;i<N;i++){const t0=-LA+2*LA*i/N,t1=-LA+2*LA*(i+1)/N,x0=r*Math.sin(t0),x1=r*Math.sin(t1);x.drawImage(labelColor,i/N*LW,0,LW/N+1,LH,x0,-LY1,x1-x0+.4,h)}
  const w=r*Math.sin(LA),gr=x.createLinearGradient(-w,0,w,0);
  [[0,'rgba(0,0,0,.62)'],[.12,'rgba(0,0,0,.22)'],[.21,'rgba(255,255,255,0)'],[.25,'rgba(255,250,235,.22)'],[.3,'rgba(255,255,255,0)'],[.6,'rgba(0,0,0,0)'],[.86,'rgba(0,0,0,.18)'],[1,'rgba(0,0,0,.6)']].forEach(([o,c])=>gr.addColorStop(o,c));
  x.fillStyle=gr;x.fillRect(-w,-LY1,2*w,h);

const jag=px=>Math.sin(px*.9)*1.4+(hash(Math.floor(px/3),5)-.5)*5;
function drawFoil(x){
  const top=3.285*K,bot=2.8*K,ty=top-(top-bot)*S.tear,amp=Math.min(1,S.tear*8);
  x.save();x.beginPath();x.moveTo(-60,-ty+jag(-60)*amp);for(let px=-60;px<=60;px+=2)x.lineTo(px,-ty+jag(px)*amp);x.lineTo(60,0);x.lineTo(-60,0);x.closePath();x.clip();
  blit(x,SPR.foil);
  if(S.tear>0){silhouette(x,FOIL);x.clip();x.strokeStyle='rgba(255,246,214,.85)';x.lineWidth=.8;x.beginPath();for(let px=-45;px<=45;px+=2){const yy=-ty+jag(px)*amp;px===-45?x.moveTo(px,yy):x.lineTo(px,yy)}x.stroke()}
  x.restore();
}
function wire(x,pts,lw){const path=()=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b))};

  const py=-3.262*K,pg=x.createLinearGradient(-.14*K,0,.14*K,0);GOLD_STOPS.forEach(([o,c])=>pg.addColorStop(o,c));

  x.save();x.translate(0,ry);const tw=[[0,0],[1.2,1.2],[-1.2,2.4],[1.2,3.6],[0,4.6]];wire(x,tw,1.25);
  const lr=Math.abs(Math.cos(S.spin))*5+.7;x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=2.6;x.beginPath();x.ellipse(0,10,lr,5.4,0,0,6.283);x.stroke();

function drawFoam(x){
  const f=Math.min(1,S.popT/.5),sc=f<1?f*1.1:1.1-Math.min(.25,(S.popT-.5)*.04),cy=-3.0*K;
  const base=x.createRadialGradient(0,cy-6*sc,1,0,cy-6*sc,24*sc);base.addColorStop(0,'rgba(255,252,242,.95)');base.addColorStop(.6,'rgba(246,240,224,.75)');base.addColorStop(1,'rgba(246,240,224,0)');
  x.fillStyle=base;x.beginPath();x.ellipse(0,cy-6*sc,26*sc,20*sc,0,0,6.283);x.fill();
  S.foamB.forEach(([bx,by,br])=>{const r=br*sc,px=bx*sc,py=cy+by*sc,gr=x.createRadialGradient(px-r*.35,py-r*.35,0,px,py,r);
    gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.75,'rgba(250,246,234,.55)');gr.addColorStop(1,'rgba(214,204,180,.5)');
    x.fillStyle=gr;x.beginPath();x.arc(px,py,r,0,6.283);x.fill();x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=.35;x.stroke()});
  for(let i=0;i<4;i++){const k=clamp((S.popT-.3-i*.3)/3.2,0,1),side=i%2?1:-1,len=[60,95,45,120][i]*k,y0=-2.97*K;
    if(len<2)continue;const yy=2.97-len/K*.5,xx=side*(R(yy)*K-1.2-i*.6);
    const gr=x.createLinearGradient(0,y0,0,y0+len);gr.addColorStop(0,'rgba(252,248,238,.85)');gr.addColorStop(1,'rgba(240,234,218,.35)');
    x.strokeStyle=gr;x.lineWidth=1.8;x.lineCap='round';x.beginPath();x.moveTo(xx,y0);x.quadraticCurveTo(xx+side*1.5,y0+len*.5,xx+side*.5,y0+len);x.stroke();
    x.fillStyle='rgba(248,243,230,.7)';x.beginPath();x.arc(xx+side*.5,y0+len,1.9,0,6.283);x.fill()}
}
function drawBottle(x){
  blit(x,SPR.glass);
  if(S.stage==='shake'&&S.spark.length){x.save();silhouette(x,PROF,9);x.clip();S.spark.forEach(p=>{x.fillStyle='rgba(220,255,230,'+p.a+')';x.beginPath();x.arc(p.x,p.y,p.s,0,6.283);x.fill()});x.restore()}
  drawLabelOn(x);
  if(!S.corkFree){x.save();x.beginPath();x.rect(-60,-4*K,120,(4-2.993)*K);x.clip();x.translate(0,-S.corkUp-3*K);x.rotate(S.corkWob);x.translate(0,3*K);blit(x,SPR.cork);x.restore()}
  else{x.fillStyle='#050a07';x.beginPath();x.ellipse(0,-3.0*K,.125*K,2.4,0,0,6.283);x.fill()}
  if(S.cageOn&&!S.cageFly)drawCage(x);
  if(S.tear<1||S.stage!=='bucket')drawFoil(x);
  S.shards.forEach(p=>{x.save();x.translate(p.x,p.y);x.rotate(p.r);const c=Math.cos(p.r*2);x.fillStyle=c>.3?'#f6dc96':c>-.3?'#c49a4a':'#7a5720';x.globalAlpha=Math.min(1,p.life*2);
    x.beginPath();p.pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill();x.restore()});
  if(S.cageFly&&S.cageOn)drawCage(x);
  if(S.corkFree&&S.popT<1.2){x.save();x.translate(S.cork.x,S.cork.y-3.1*K);x.rotate(S.cork.r);x.translate(0,3.1*K);blit(x,SPR.cork);x.restore()}
  if(S.popT>0)drawFoam(x);
}
function render(){
  const d=DPR(),z=cam.z*S0,ox=W/2-cam.x*z+rnd(-1,1)*cam.sh,oy=H/2-cam.y*z+rnd(-1,1)*cam.sh;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,glc.width,glc.height);
  g.setTransform(d*z,0,0,d*z,d*ox,d*oy);
  // стол
  g.save();g.fillStyle=SPR.wood;g.translate(0,-60);g.scale(.8,.8);g.fillRect(-3000,0,6000,4000);g.restore();
  const tg=g.createLinearGradient(0,-60,0,320);tg.addColorStop(0,'rgba(11,8,20,1)');tg.addColorStop(.06,'rgba(60,30,40,.55)');tg.addColorStop(.2,'rgba(255,150,110,.06)');tg.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=tg;g.fillRect(-3000,-60,6000,3000);
  const sh=g.createRadialGradient(0,0,10,0,0,230);sh.addColorStop(0,'rgba(0,0,0,.75)');sh.addColorStop(1,'rgba(0,0,0,0)');g.save();g.scale(1,.16);g.fillStyle=sh;g.beginPath();g.arc(0,0,230,0,6.283);g.fill();g.restore();
  const front=S.stage!=='bucket'&&(S.stage!=='lift'||S.liftT>.35);
  blit(g,SPR.bucketBack);
  ICE.forEach(c=>{if(!c.front){g.save();g.translate(c.x,c.y);g.rotate(c.r);blit(g,SPR.ice[c.k]);g.restore()}});
  const bottleAt=()=>{g.save();g.translate(S.bx,S.by);g.rotate(S.br);drawBottle(g);g.restore()};
  if(!front)bottleAt();
  ICE.forEach(c=>{if(c.front){g.save();g.translate(c.x+(S.stage==='bucket'?Math.sin(S.t*40+c.x)*S.jig*1.2:0),c.y);g.rotate(c.r);blit(g,SPR.ice[c.k]);g.restore()}});
  blit(g,SPR.bucketFront);
  if(front)bottleAt();
}

function update(dt){
  S.t+=dt;const t=S.t,st=S.stage;S.jig*=Math.exp(-dt*6);
  if(st==='bucket'){
    if(!ptr&&S.lift>0){const was=S.lift;S.lift=Math.max(0,S.lift-dt*1.8);if(was>.15&&S.lift===0)sfx('thud')}
    S.bx=IN_B.x+Math.sin(t*40)*S.jig*1.5;S.by=IN_B.y-S.lift*1.32*K;S.br=IN_B.r*(1-S.lift*.5)+Math.sin(t*33)*S.jig*.012;
  }else if(st==='lift'){
    S.liftT=Math.min(1,S.liftT+dt/1.1);const e=ease(S.liftT),y0=IN_B.y-1.32*K;
    S.bx=IN_B.x+(HAND.x-IN_B.x)*e;S.by=y0+(HAND.y-y0)*e-Math.sin(e*Math.PI)*60;S.br=IN_B.r*.5*(1-e);
    if(S.liftT>=1)S.stage='unwrap';
  }else{
    if(st!=='shake'||!ptr)S.shakeX*=Math.exp(-dt*(st==='shake'?3:6));
    S.recoil*=Math.exp(-dt*7);
    const jit=st==='shake'&&S.pressure>.35?(S.pressure-.35)*2.4:0;
    S.bx=HAND.x+S.shakeX+Math.sin(t*61)*jit;S.by=HAND.y+S.recoil+Math.sin(t*.9)*1.5;S.br=S.shakeX*.0035+Math.sin(t*57)*jit*.004;
  }
  // осколки фольги
  for(let i=S.shards.length-1;i>=0;i--){const p=S.shards[i];p.life-=dt;if(p.life<=0){S.shards.splice(i,1);continue}p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt}
  if(st==='cagefall'){S.fall+=dt;const c=S.cage;c.vy+=2200*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;if(S.fall>1){S.cageOn=false;S.stage='shake'}}
  if(st==='shake'){
    if(!ptr)S.pressure=Math.max(0,S.pressure-dt*.03);
    S.corkUp=clamp((S.pressure-.45)/.55,0,1)*20;S.corkWob=S.corkUp>1?Math.sin(t*27)*.02*(S.corkUp/20):0;
    if(Math.random()<dt*60*S.pressure&&S.spark.length<160){const yy=rnd(.1,1.8);S.spark.push({x:rnd(-.85,.85)*R(yy)*K,y:-yy*K,vy:-rnd(40,140),s:rnd(.5,1.4),a:rnd(.2,.6)})}
    if(S.corkUp>8&&Math.random()<dt*10){const p=toScreen(3.0);fizzle(p.x,p.y)}
  }
  for(let i=S.spark.length-1;i>=0;i--){const p=S.spark[i];p.y+=p.vy*dt;p.x+=Math.sin(t*6+i)*.2;if(p.y<-2.6*K||st!=='shake')S.spark.splice(i,1)}
  if(st==='pop'||st==='bubbles'||st==='done'){
    S.popT+=dt;const c=S.cork;c.vy+=2600*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=dt*16;
    if(S.popT<6&&Math.random()<dt*12){const p=toScreen(3.1);fizzle(p.x,p.y)}
    if(st==='pop'&&S.popT>1.3){S.stage='bubbles';startBubbles()}
  }
  // камера
  const f=FR[FRAME_OF[S.stage]],k=1-Math.exp(-dt*2.2);
  cam.y+=(f.y-cam.y)*k;cam.z+=(f.z-cam.z)*k;cam.sh*=Math.exp(-dt*6);
}
function resize(){
  W=innerWidth;H=innerHeight;const d=DPR();glc.width=Math.round(W*d);glc.height=Math.round(H*d);
  const ns=Math.min(H/820,W/420);const rebuild=!SPR.glass||Math.abs(ns-S0)/S0>.25;S0=ns;if(rebuild)buildSprites();
  fitFx();fitFw();drawBokeh();
}

const fwc=$('fw'),fx2=fwc.getContext('2d');let FW=[],fwNext=3,fwMode='calm';
const FW_COLS=[[255,214,140],[255,245,225],[255,140,170],[140,230,215],[190,170,255],[255,180,90]];
function fitFw(){const d=Math.min(devicePixelRatio||1,2);fwc.width=W*d;fwc.height=H*d;fx2.setTransform(d,0,0,d,0,0)}
function launch(big){
  const x0=rnd(.12,.88)*W,y0=H*.72,ty=rnd(.1,big?.36:.42)*H,T=rnd(.9,1.3);
  FW.push({k:'r',x0,y0,x:x0,y:y0,tx:x0+rnd(-40,40),ty,T,t:0,big,col:FW_COLS[Math.floor(Math.random()*FW_COLS.length)]});
}
function explode(r){
  const n=r.big?150:80,sp=(r.big?1:.6)*Math.min(W,H)*.32,c2=Math.random()<.4?FW_COLS[Math.floor(Math.random()*FW_COLS.length)]:r.col;
  for(let i=0;i<n;i++){const a=rnd(0,6.283),v=sp*Math.sqrt(Math.random())*rnd(.85,1.1),c=i%3===0?c2:r.col;
    FW.push({k:'s',x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(1.1,2),max:2,col:c,fl:Math.random()<.3})}
  FW.push({k:'f',x:r.x,y:r.y,life:.35,r:sp*.6,col:r.col});
  sfx('boom',r.big?.9:.4);
}
function updateFw(dt){
  fwNext-=dt;
  if(fwNext<=0){if(fwMode==='calm'){launch(false);fwNext=rnd(4,8)}else if(fwMode==='show'){launch(true);fwNext=rnd(.9,2.2)}}
  fx2.clearRect(0,0,W,H);fx2.globalCompositeOperation='lighter';
  for(let i=FW.length-1;i>=0;i--){const p=FW[i];
    if(p.k==='r'){p.t+=dt;const e=1-Math.pow(1-Math.min(1,p.t/p.T),2),nx=p.x0+(p.tx-p.x0)*e,ny=p.y0+(p.ty-p.y0)*e;
      fx2.strokeStyle='rgba(255,220,170,.8)';fx2.lineWidth=1.6;fx2.beginPath();fx2.moveTo(p.x,p.y);fx2.lineTo(nx,ny);fx2.stroke();
      fx2.fillStyle='rgba(255,240,210,.9)';fx2.beginPath();fx2.arc(nx,ny,1.8,0,6.283);fx2.fill();p.x=nx;p.y=ny;
      if(p.t>=p.T){FW.splice(i,1);explode(p)}continue}
    p.life-=dt;if(p.life<=0){FW.splice(i,1);continue}
    if(p.k==='f'){const a=p.life/.35*.35,g2=fx2.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g2.addColorStop(0,'rgba('+p.col+','+a+')');g2.addColorStop(1,'rgba('+p.col+',0)');fx2.fillStyle=g2;fx2.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);continue}
    const dr=Math.exp(-dt*1.6);p.vx*=dr;p.vy=p.vy*dr+70*dt;p.px=p.x;p.py=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;
    let a=Math.min(1,p.life/.8);if(p.fl)a*=.4+Math.random()*.6;
    fx2.strokeStyle='rgba('+p.col+','+a+')';fx2.lineWidth=1.7;fx2.beginPath();fx2.moveTo(p.px-(p.x-p.px)*2.5,p.py-(p.y-p.py)*2.5);fx2.lineTo(p.x,p.y);fx2.stroke();
  }
  fx2.globalCompositeOperation='source-over';
}

const sky=$('sky'),slots=[];

function buildItems(){
  items=PHOTOS.map(p=>({type:'photo',p}));
}
function buildSides(){
  $('sideL').innerHTML='';$('sideR').innerHTML='';slots.length=0;
  const per=Math.ceil(PHOTOS.length/2);
  for(const id of['sideL','sideR'])$(id).style.width='max(54px,min(22vw,calc((100dvh - 110px) / '+(per*1.36).toFixed(2)+'),150px))';
  for(let i=0;i<per;i++)for(const id of['sideL','sideR']){const d=document.createElement('div');d.style.width='100%';d.style.aspectRatio='4 / 5.2';$(id).appendChild(d);slots.push(d)}
}
function startBubbles(){bubblesOn=true;queue=shuffle(items.slice());active=[];acc=.6}
function spawn(){
  if(!queue.length||active.length>=(W<500?6:8))return;
  const it=queue.shift(),size=W<500?rnd(62,86):rnd(74,100),lip=toScreen(3.1);
  const el=document.createElement('button');el.type='button';el.className='bubble';el.style.width=el.style.height=size+'px';
  el.setAttribute('aria-label',it.type==='photo'?'Пузырёк с фото':'Пузырёк с пожеланием');
  if(it.type==='photo')el.innerHTML='<span class="in">'+photoHTML(it.p)+'</span>';
  sky.appendChild(el);
  const lo=Math.min(W*.28,150),b={it,el,size,t:0,x0:lip.x,y0:lip.y,lane:rnd(lo,W-lo),speed:rnd(36,60),ph:rnd(0,6.28),amp:rnd(6,16),gone:false};
  el.addEventListener('pointerdown',e=>{e.preventDefault();popBubble(b)});
  el.addEventListener('click',()=>popBubble(b));

}
function updateBubbles(dt){
  if(!bubblesOn)return;
  for(let i=active.length-1;i>=0;i--){
    const b=active[i];b.t+=dt;const k=Math.min(1,b.t/2.2),e=1-Math.pow(1-k,3);
    const x=b.x0+(b.lane-b.x0)*e+Math.sin(b.t*1.2+b.ph)*b.amp,y=b.y0-b.t*b.speed*(1+b.t*.04)-b.size/2;
    b.el.style.transform='translate3d('+(x-b.size/2).toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    b.el.style.scale=Math.min(1,.15+b.t*1.2).toFixed(2);
    if(y<-b.size-20){active.splice(i,1);b.el.remove();queue.push(b.it)}
  }
  acc+=dt;if(acc>1){acc=0;spawn()}
}
function showNote(text){
  const old=document.querySelector('.note');if(old)old.remove();
  const n=document.createElement('div');n.className='note';n.style.setProperty('--r',rnd(-2.5,2.5).toFixed(1)+'deg');n.innerHTML='<p></p>';n.querySelector('p').textContent=text;
  n.addEventListener('click',()=>hideNote(n));document.body.appendChild(n);
  clearTimeout(noteTimer);noteTimer=setTimeout(()=>hideNote(n),7000);
}
function hideNote(n){if(!n.isConnected)return;n.classList.add('out');setTimeout(()=>n.remove(),360)}
function popBubble(b){
  if(b.gone)return;b.gone=true;
  const r=b.el.getBoundingClientRect();b.el.classList.add('pop');setTimeout(()=>b.el.remove(),240);
  const ix=active.indexOf(b);if(ix>-1)active.splice(ix,1);
  burstAt(r.left+r.width/2,r.top+r.height/2);sfx('blip');found++;
  if(b.it.type==='wish')showNote(b.it.text);else addPhoto(b.it,r);
  if(found>=items.length){bubblesOn=false;S.stage='done';setTimeout(finale,1300)}
}
function addPhoto(it,from){
  const slot=slots[filled++];if(!slot)return;
  const cap=it.p.caption||'',rot=rnd(-5,5);
  const el=document.createElement('button');el.type='button';el.className='print';el.style.setProperty('--r',rot.toFixed(1)+'deg');el.setAttribute('aria-label',cap?'Фото '+cap:'Фото');
  el.innerHTML='<div class="ph">'+photoHTML(it.p)+'</div>'+(cap?'<span class="cap"></span>':'');if(cap)el.querySelector('.cap').textContent=cap;
  el.addEventListener('click',()=>{$('vPh').innerHTML=photoHTML(it.p);$('vCap').textContent=cap;$('viewer').hidden=false});
  el.style.visibility='hidden';slot.appendChild(el);
  const to=el.getBoundingClientRect(),fly=el.cloneNode(true);fly.classList.add('fly');fly.style.visibility='visible';fly.style.width=to.width+'px';fly.style.padding=getComputedStyle(el).padding;document.body.appendChild(fly);
  const s0=Math.max(.2,from.width/to.width*.8);
  const a=fly.animate([
    {transform:'translate('+(from.left+from.width/2-to.width/2)+'px,'+(from.top+from.height/2-to.height/2)+'px) scale('+s0+') rotate(-25deg)',opacity:.2},
    {transform:'translate('+to.left+'px,'+to.top+'px) scale(1) rotate('+rot+'deg)',opacity:1}],{duration:reduce?1:850,easing:'cubic-bezier(.2,.85,.25,1.05)'});
  a.onfinish=()=>{fly.remove();el.style.visibility='visible'};
}
function finale(){confetti();fireFinale();sfx('chime');$('finale').hidden=false;$('fClose').focus()}
function resetAll(){
  active.forEach(b=>b.el.remove());active=[];queue=[];sky.innerHTML='';bubblesOn=false;found=0;filled=0;
  const n=document.querySelector('.note');if(n)n.remove();
  buildSides();buildItems();resetState();fwMode='calm';fwNext=3;
}

/* ===== Запуск ===== */
$('fOver').textContent=ANNIV+' '+plural(ANNIV,'год','года','лет')+' вместе · '+ANNIV_NAME+' свадьба';
$('fTitle').textContent='С годовщиной, '+FINAL_NAMES+'!';
$('fText').textContent=FINAL_TEXT;
$('fFrom').textContent='С любовью, '+FROM;
$('fClose').addEventListener('click',()=>{$('finale').hidden=true});
$('fAgain').addEventListener('click',()=>{$('finale').hidden=true;resetAll()});
$('viewer').addEventListener('click',()=>{$('viewer').hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape'){$('viewer').hidden=true;$('finale').hidden=true}});
$('snd').addEventListener('click',()=>{muted=!muted;$('snd').setAttribute('aria-pressed',String(!muted));if(silentEl){if(muted)silentEl.pause();else silentEl.play().catch(()=>{})}if(!muted)unlockAudio()});
function tickLabel(){drawLabel();const e=elapsed(new Date());$('fAge').textContent=ageText(e)+' '+timeText(e)}
tickLabel();setInterval(tickLabel,1000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{paperCache=null;tickLabel()});
resize();resetAll();
const bgEl=$('bg');
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  update(dt);render();drawFx(dt);updateBubbles(dt);updateFw(dt);
  bgEl.style.transform='translate3d(0,'+clamp(-(cam.y-FR.bucket.y)*S0*.09,0,H*.28).toFixed(1)+'px,0)';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
